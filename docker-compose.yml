# Postgres for quiz history. Data lives in the named volume, so it survives
# container restarts, `docker compose down`, Docker restarts and reboots.
# Only `docker compose down -v` (or deleting the volume) erases it.
services:
  db:
    image: postgres:18.6
    container_name: study-quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: study_quiz
    ports:
      - "127.0.0.1:5499:5432"
    volumes:
      - study-quiz-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d study_quiz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  study-quiz-pgdata:
    name: study-quiz-pgdata
